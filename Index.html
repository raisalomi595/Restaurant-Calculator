<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Order Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>Restaurant</h1>
            <p class="subtitle">Order Calculator</p>
        </header>

        <!-- Menu Section -->
        <section>
            <h2>Menu</h2>
            <div id="menu-container"></div>
        </section>

        <!-- Order Summary Section -->
        <section id="order-summary">
            <h2>Summary</h2>
            <div id="summary-content">
                <p class="empty-state">No items ordered yet.</p>
            </div>
            <div id="subtotal-container">
                <div class="total-row">
                    <span>Subtotal</span>
                    <span>Rs. <span id="subtotal-display">0</span></span>
                </div>
            </div>
        </section>

        <!-- Order Details Section -->
        <section id="order-details">
            <h2>Details</h2>

            <div class="order-type-group">
                <p class="field-label">Order Type</p>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="order-type" value="dine-in" checked>
                        <span class="radio-custom"></span>
                        <span>Dine In</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="order-type" value="takeaway">
                        <span class="radio-custom"></span>
                        <span>Takeaway</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="order-type" value="delivery">
                        <span class="radio-custom"></span>
                        <span>Delivery</span>
                    </label>
                </div>
            </div>

            <div id="delivery-charge-container">
                <div class="total-row">
                    <span>Delivery</span>
                    <span>Rs. <span id="delivery-charge-display">0</span></span>
                </div>
            </div>

            <div id="address-container" class="hidden">
                <label for="address-input" class="field-label">Delivery Address</label>
                <input type="text" id="address-input" placeholder="Enter delivery address...">
            </div>

            <div id="grand-total-container">
                <div class="total-row grand">
                    <span>Total</span>
                    <span>Rs. <span id="grand-total-display">0</span></span>
                </div>
            </div>
        </section>

        <!-- Customer Information Section -->
        <section id="customer-info">
            <h2>Customer</h2>

            <div class="form-group">
                <label for="customer-name" class="field-label">Name</label>
                <input type="text" id="customer-name" placeholder="Enter customer name...">
            </div>

            <div class="form-group">
                <label for="phone-number" class="field-label">Phone</label>
                <input type="text" id="phone-number" placeholder="Enter phone number...">
            </div>

            <div class="form-group">
                <label for="customer-address" class="field-label">Address</label>
                <input type="text" id="customer-address" placeholder="Enter customer address...">
            </div>
        </section>

        <!-- Place Order Button -->
        <div id="order-actions">
            <button id="place-order-btn">Place Order</button>
        </div>

        <!-- Order Confirmation Section -->
        <div id="order-confirmation" class="hidden">
            <h2>Order Confirmed</h2>
            <div id="confirmation-content"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
